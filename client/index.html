    <noscript>
      <div style="padding:32px 20px;text-align:center;font-family:sans-serif;color:#172B3A;">
        <p style="font-size:18px;font-weight:700;">MistriDako চালু করতে JavaScript দরকার</p>
        <p style="font-size:15px;color:#555;">আপনার ব্রাউজারে JavaScript চালু করে পেজটি আবার খুলুন।</p>
      </div>

    <!-- Boot watchdog (plain ES5, no modules): if the app bundle cannot
         start in this browser — old WebView, blocked/dropped script, very
         slow network — the page would otherwise sit frozen like a picture
         with dead buttons. After ~12s with an empty app root, show a
         plain-language message with a working reload button instead.
         The moment React mounts (root gains a child) the watchdog stops. -->
    <script>
      (function () {
        var root = document.querySelector("[data-generated-space-root]");
        if (!root) return;
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (root.children.length > 0) {
            clearInterval(timer);
            return;
          }
          if (tries < 12) return;
          clearInterval(timer);
          if (document.getElementById("gs-boot-fallback")) return;
          var box = document.createElement("div");
          box.id = "gs-boot-fallback";
          box.style.cssText =
            "padding:36px 20px;text-align:center;font-family:sans-serif;color:#172B3A;background:#ffffff;";
          var h = document.createElement("p");
          h.style.cssText = "font-size:18px;font-weight:700;margin:0 0 8px;";
          h.textContent = "পেজটি চালু হতে সমস্যা হচ্ছে";
          var p = document.createElement("p");
          p.style.cssText = "font-size:15px;line-height:1.55;color:#555;margin:0 auto 18px;max-width:340px;";
          p.textContent =
            "আপনার ব্রাউজারটি পুরনো হলে বা ইন্টারনেট সংযোগ ধীর হলে এমন হতে পারে। Chrome ব্রাউজারটি আপডেট করে আবার চেষ্টা করুন।";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "আবার চেষ্টা করুন";
          btn.style.cssText =
            "background:#075B35;color:#ffffff;border:0;padding:12px 26px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;";
          btn.onclick = function () {
            window.location.reload();
          };
          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(btn);
          root.appendChild(box);
        }, 1000);
      })();
    </script>
