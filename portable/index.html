    <!-- Structured data: Organization + WebSite (site-wide facts only —
         real name, tagline and the Tangail service area; no invented
         address, ratings or prices. Page-level WebPage / BreadcrumbList /
         Service / Person markup is added per route by client/src/seo.ts
         and by the build-time prerenderer. LocalBusiness is omitted on
         purpose: there is no verified physical business address. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://mistridako.vercel.app/#organization","name":"MistriDako","alternateName":"মিস্ত্রি ডাকো","url":"https://mistridako.vercel.app/","logo":"https://mistridako.vercel.app/icon-512.png","slogan":"এক ডাকেই, ঘরের সমাধান।","description":"Find trusted electricians, plumbers, AC technicians, painters and home repair professionals in Bangladesh with MistriDako. Book home services easily.","areaServed":{"@type":"AdministrativeArea","name":"Tangail District, Bangladesh"}},{"@type":"WebSite","@id":"https://mistridako.vercel.app/#website","name":"MistriDako","url":"https://mistridako.vercel.app/","inLanguage":["bn","en"],"publisher":{"@id":"https://mistridako.vercel.app/#organization"}}]}
    </script>
    <!-- Clean-URL bridge (SEO): production serves crawlable clean URLs
         (/services/<slug>, /locations/tangail, policy pages…) as
         prerendered shells or the SPA shell. The app itself is
         hash-routed, so a directly opened clean URL is translated to
         the equivalent hash route before the app boots. Existing hash
         links, bookmarks and the PWA are untouched. -->
    <script>
      (function () {
        if (window.location.hash) return;
        var p = window.location.pathname.replace(/\/+$/, "") || "/";
        var m;
        var target = null;
        if ((m = p.match(/^\/services\/([a-z0-9-]+)$/))) target = "/service/" + m[1];
        else if (p === "/services") target = "/services";
        else if ((m = p.match(/^\/professionals\/(\d+)$/))) target = "/pro/" + m[1];
        else if (p === "/professionals") target = "/professionals";
        else if (p === "/locations/tangail") target = "/locations/tangail";
        else if (p === "/how-it-works") target = "/how";
        else if (p === "/become-a-professional") target = "/join";
        else if (p === "/privacy-policy") target = "/privacy";
        else if (p === "/terms") target = "/terms";
        else if (p === "/professional-agreement") target = "/pro-agreement";
        else if (["/about", "/contact", "/help", "/download-app", "/payment-policy", "/cancellation-policy", "/refund-policy", "/commission-policy", "/dispute-policy"].indexOf(p) !== -1) target = p;
        if (target) history.replaceState(null, "", "/#" + target);
      })();
    </script>
    <!-- PWA: installable from the browser (see /manifest.webmanifest and
         the service worker registered in client/src/main.tsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>MistriDako | Trusted Home Services in Bangladesh</title>
    <script src="/client/src/main.tsx" type="module"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
     
    ></div>
    <noscript>
      <div style="padding:32px 20px;text-align:center;font-family:sans-serif;color:#172B3A;">
        <p style="font-size:18px;font-weight:700;">MistriDako চালু করতে JavaScript দরকার</p>
        <p style="font-size:15px;color:#555;">আপনার ব্রাউজারে JavaScript চালু করে পেজটি আবার খুলুন।</p>
      </div>
    </noscript>
    <!-- Boot watchdog (plain ES5, no modules): if the app bundle cannot
         start in this browser — old WebView, blocked/dropped script, very
         slow network — the page would otherwise sit frozen like a picture
         with dead buttons. After ~12s with an empty app root, show a
         plain-language message with a working reload button instead.
         The moment React mounts (root gains a child) the watchdog stops. -->
    <script>
      (function () {
        var root = document.querySelector("[data-generated-space-root]");
        if (!root) return;
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (root.children.length > 0) {
            clearInterval(timer);
            return;
          }
          if (tries < 12) return;
          clearInterval(timer);
          if (document.getElementById("gs-boot-fallback")) return;
          var box = document.createElement("div");
          box.id = "gs-boot-fallback";
          box.style.cssText =
            "padding:36px 20px;text-align:center;font-family:sans-serif;color:#172B3A;background:#ffffff;";
          var h = document.createElement("p");
          h.style.cssText = "font-size:18px;font-weight:700;margin:0 0 8px;";
          h.textContent = "পেজটি চালু হতে সমস্যা হচ্ছে";
          var p = document.createElement("p");
          p.style.cssText = "font-size:15px;line-height:1.55;color:#555;margin:0 auto 18px;max-width:340px;";
          p.textContent =
            "আপনার ব্রাউজারটি পুরনো হলে বা ইন্টারনেট সংযোগ ধীর হলে এমন হতে পারে। Chrome ব্রাউজারটি আপডেট করে আবার চেষ্টা করুন।";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "আবার চেষ্টা করুন";
          btn.style.cssText =
            "background:#075B35;color:#ffffff;border:0;padding:12px 26px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;";
          btn.onclick = function () {
            window.location.reload();
          };
          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(btn);
          root.appendChild(box);
        }, 1000);
      })();
    </script>
  </body>
</html>
